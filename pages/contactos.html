<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Widok Data</title>

  <!-- Bootstrap (solo para el form) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-container">

      <a href="../index.html" class="logo">
        <img src="../img/logowidok.png" alt="Widok Data">
      </a>

      <nav class="main-nav">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="sobre_nosotros.html">Sobre nosotros</a></li>
          <li><a href="producto.html">Servicios</a></li>
          <li><a href="proyectos.html">Proyectos</a></li>
          <li><a href="contactos.html" class="active">Contacto</a></li>
        </ul>
      </nav>

    </div>
  </header>

  <!-- MAIN -->
  <main>

    <!-- INTRO -->
    <section class="about">
      <div class="about-grid">

        <div class="about-text">
          <h1>Contactanos</h1>

          <p>
            ¿Tenés un proyecto en mente o querés mejorar
            la forma en que usás tus datos?
          </p>

          <p>
            Completá el formulario y te respondemos
            en menos de 48 horas.
          </p>
        </div>

        <div class="about-image">
          <img src="../img/graficos.png" alt="Contacto Widok Data">
        </div>

      </div>
    </section>

    <!-- FORMULARIO -->
    <section>
      <form class="grid-2">

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" placeholder="Tu nombre">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="tu@email.com">
        </div>

        <div class="mb-3" style="grid-column: 1 / -1;">
          <label class="form-label">Mensaje</label>
          <textarea class="form-control" rows="5" placeholder="Contanos sobre tu proyecto"></textarea>
        </div>

        <div>
          <button type="submit" class="btn btn-outline-dark">
            Enviar mensaje
          </button>
        </div>

      </form>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 Widok Data · Visualize your horizon</p>
    </div>
  </footer>

</body>
</html>
